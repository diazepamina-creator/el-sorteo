<style>
:root{

  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#16140f; --papel2:#1e1b15; --tarjeta:#221f18; --tinta:#efe8da; --tinta2:#b9b0a0; --tinta3:#857d6f;
  --linea:#363127; --laton:#d0a957; --ok:#7fb08d; --aviso:#e08a5e; --bola:#8fb3d4;
  --sombra:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --papel:#16140f; --papel2:#1e1b15; --tarjeta:#221f18; --tinta:#efe8da; --tinta2:#b9b0a0; --tinta3:#857d6f;
  --linea:#363127; --laton:#d0a957; --ok:#7fb08d; --aviso:#e08a5e; --bola:#8fb3d4;
  --sombra:0 1px 0 rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--papel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.marca{font-family:var(--serif);font-size:1.35rem;font-weight:600}
.marca small{font-family:var(--sans);font-weight:400;font-size:.75rem;color:var(--tinta3);margin-left:8px;letter-spacing:.06em;text-transform:uppercase}
.icobtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--linea);background:var(--tarjeta);display:grid;place-items:center}
.icobtn svg{width:20px;height:20px;stroke:var(--tinta2);fill:none;stroke-width:1.6}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tarjeta);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:64px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;color:var(--tinta3);letter-spacing:.03em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav.tabs button.on{color:var(--tinta)}
nav.tabs button.on svg{stroke:var(--laton)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h2.sec{font-size:1.05rem;margin:28px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2.sec span{font-family:var(--sans);font-weight:400;font-size:.78rem;color:var(--tinta3)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta3)}
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra)}
.pad{padding:16px}
.muted{color:var(--tinta2)} .dim{color:var(--tinta3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{text-decoration:none;border:1px solid var(--tinta);background:var(--tinta);color:var(--papel);border-radius:999px;padding:10px 18px;font-weight:500;font-size:.95rem;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--linea)}
.btn.peq{padding:7px 13px;font-size:.85rem}
.btn.peligro{background:transparent;color:var(--aviso);border-color:color-mix(in srgb,var(--aviso) 45%,transparent)}
.btn:disabled{opacity:.4}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;padding:3px 9px;border-radius:999px;border:1px solid var(--linea);color:var(--tinta2);white-space:nowrap;background:transparent}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip.lucir{border-color:color-mix(in srgb,var(--laton) 60%,transparent);color:var(--laton)}
.pista{font-size:.8rem;color:var(--tinta3)}
.barra{height:10px;border-radius:999px;background:var(--papel2);margin:12px 0 10px;position:relative;overflow:hidden}
.barra b{position:absolute;inset:0 auto 0 0;background:var(--laton);border-radius:999px;transition:width .5s}
.barra i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--laton) 28%,transparent);border-radius:999px}
.saludo{padding:22px 0 4px}
.saludo h1{font-size:1.65rem;line-height:1.15}
.saludo p{margin:6px 0 0;color:var(--tinta2)}
.grande{font-family:var(--serif);font-size:2.1rem;font-weight:600;line-height:1}
.cifras{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lista{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%;background:var(--tarjeta);border:1px solid var(--linea);border-radius:12px}
.item .n{font-family:var(--mono);font-size:.85rem;color:var(--tinta3);min-width:26px}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:500;display:block;font-size:.95rem;line-height:1.3}
.item .t small{color:var(--tinta3);font-size:.78rem}
.item.fuera{opacity:.62;background:transparent}
.puntos{display:flex;gap:3px}
.puntos i{width:7px;height:7px;border-radius:50%;background:var(--linea)}
.puntos i.s{background:var(--laton)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.seg button{border:1px solid var(--linea);background:transparent;border-radius:10px;padding:8px 2px;font-size:.72rem;line-height:1.2;color:var(--tinta2)}
.seg button.on{background:var(--laton);border-color:var(--laton);color:#fff}
.libros{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:.9rem;margin-top:6px}
.libros dt{color:var(--tinta3);font-size:.78rem;padding-top:2px}
.libros dd{margin:0}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--linea);background:var(--papel);border-radius:10px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
label.campo{display:block;margin-top:12px;font-size:.8rem;color:var(--tinta2)}
label.campo > *{margin-top:4px}
.hoja{position:fixed;inset:0;z-index:50;background:rgba(20,16,10,.42);display:none;align-items:flex-end;justify-content:center}
.hoja.ver{display:flex}
.hoja .panel{background:var(--papel);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.panel .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.panel h3{font-size:1.2rem;line-height:1.25}
.cerrar{border:0;background:none;font-size:1.6rem;line-height:1;color:var(--tinta3);padding:0 4px}
.bolas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 8px}
.bolaw{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bola{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:1.25rem;color:var(--tinta);background:radial-gradient(circle at 35% 30%,#fff 0 18%,#f1ead9 40%,#d8ccb2 100%);box-shadow:inset -4px -6px 10px rgba(0,0,0,.12),0 4px 10px -4px rgba(0,0,0,.35);opacity:0;transform:translateY(-24px) scale(.6)}
.bola.cae{animation:cae .5s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes cae{to{opacity:1;transform:none}}
.bola.mia{background:radial-gradient(circle at 35% 30%,#fff 0 14%,#f2d896 45%,#c9a24e 100%)}
.bolaw small{font-size:.72rem;color:var(--tinta2);line-height:1.25}
.bolaw button{border:1px solid var(--linea);background:var(--tarjeta);border-radius:999px;font-size:.75rem;padding:4px 10px}
.reloj{font-family:var(--mono);font-size:3rem;text-align:center;margin:18px 0 6px;letter-spacing:.02em}
.sellos{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.sello{flex:0 0 auto;width:74px;text-align:center;font-size:.68rem;color:var(--tinta3);line-height:1.2}
.sello .m{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;border:1.5px dashed var(--linea);display:grid;place-items:center;font-family:var(--serif);font-size:1.1rem;color:var(--tinta3)}
.sello.si{color:var(--tinta2)}
.sello.si .m{border:0;background:radial-gradient(circle at 35% 30%,#f7e3a8,#c9a24e 70%,#9c7a2f);color:#3b2c0c;box-shadow:0 3px 8px -3px rgba(0,0,0,.4)}
.aviso-suave{font-size:.85rem;color:var(--tinta2);background:var(--papel2);border-radius:10px;padding:10px 12px;margin-top:12px}
.tabla{width:100%;border-collapse:collapse;font-size:.88rem}
.bloq{margin-bottom:12px}
.bloq h3{font-size:1rem;margin-bottom:6px}
.bloq .r{display:grid;grid-template-columns:86px 1fr;gap:4px 10px;font-size:.86rem;padding:3px 0}
.bloq .r span:first-child{color:var(--tinta3);font-size:.75rem;padding-top:2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.ver{opacity:1}
.vacio{padding:18px;text-align:center;color:var(--tinta3);font-size:.9rem}
.buscar{margin:10px 0}
</style>
</head>

const CLAVE="el-sorteo-v1";
const hoyISO=()=>fechaISO(new Date());
function fechaISO(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function sumaDias(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return fechaISO(d);}
function difDias(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);}

];

function estadoInicial(){
  const temas={};
  for(let n=1;n<=TOTAL;n++){temas[n]={sel:!!SEL_INICIAL[n],tipo:SEL_INICIAL[n]==="l"?"l":"s",est:0,rep:null,nota:""};}
  return {v:1,temas,rec:recIniciales(),problemas:[],sesiones:[],simulacros:[],examen:"2027-09-01",meta:14,minSim:120,sellos:{},creado:hoyISO()};
}
let S;
function cargar(){
  try{const t=localStorage.getItem(CLAVE); if(t){S=JSON.parse(t);} }catch(e){}
  if(!S||!S.temas){S=estadoInicial();}
  for(let n=1;n<=TOTAL;n++) if(!S.temas[n]) S.temas[n]={sel:false,tipo:"s",est:0,rep:null,nota:""};
  S.sellos=S.sellos||{}; S.rec=Array.isArray(S.rec)?S.rec:recIniciales(); S.problemas=S.problemas||[]; S.sesiones=S.sesiones||[]; S.simulacros=S.simulacros||[];
}
function guardar(){ try{localStorage.setItem(CLAVE,JSON.stringify(S));}catch(e){} revisarSellos(); }

/* ===================== CÁLCULOS ===================== */
function comb(n,k){if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r;}
function cobertura(k){return 1-comb(TOTAL-k,BOLAS)/comb(TOTAL,BOLAS);}
function dosOMas(k){return 1-comb(TOTAL-k,BOLAS)/comb(TOTAL,BOLAS)-k*comb(TOTAL-k,BOLAS-1)/comb(TOTAL,BOLAS);}
const listos=()=>Object.keys(S.temas).filter(n=>S.temas[n].est>=3).map(Number);
const elegidos=()=>Object.keys(S.temas).filter(n=>S.temas[n].sel).map(Number).sort((a,b)=>a-b);
const pct=x=>Math.round(x*100)+" %";
function inicioSemana(){const d=new Date();const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return fechaISO(d);}
function minutosSemana(){const i=inicioSemana();return S.sesiones.filter(s=>s.d>=i).reduce((a,s)=>a+(+s.min||0),0);}
function problemasPendientes(){const h=hoyISO();return S.problemas.filter(p=>p.prox&&p.prox<=h).sort((a,b)=>a.prox<b.prox?-1:1);}
function paraRefrescar(){
  return listos().map(n=>({n,ult:S.temas[n].rep||"0000"})).sort((a,b)=>a.ult<b.ult?-1:1)
    .filter(x=>x.ult==="0000"||difDias(x.ult,hoyISO())>=21).slice(0,2);
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

["rep","Primer problema rehecho",()=>S.problemas.some(p=>(p.hist||[]).length>=2),"↻"]
];
const SELLOS_HISTORICOS=["sem"]; /* la semana cumplida queda ganada aunque cambie la semana */
function revisarSellos(){
  let nuevo=null;
  for(const [id,nom,f] of SELLOS){
    const ok=f();
    if(!S.sellos[id]&&ok){S.sellos[id]=hoyISO();nuevo=nom;}
    else if(S.sellos[id]&&!ok&&!SELLOS_HISTORICOS.includes(id)){delete S.sellos[id];}
  }
  if(nuevo){ try{localStorage.setItem(CLAVE,JSON.stringify(S));}catch(e){} setTimeout(()=>toast("Sello nuevo: "+nuevo),300); }
}

  const dias=difDias(hoyISO(),S.examen);
  const minS=minutosSemana(), meta=S.meta*60;
  const sig=Math.min(TOTAL,k+5);
  const pend=problemasPendientes().slice(0,3);
  const refr=paraRefrescar();
  const h=new Date().getHours();
  const saludo=h<14?"Buenos días, Andrés":h<21?"Buenas tardes, Andrés":"Buenas noches, Andrés";
  $("#vista").innerHTML=`
  <section class="saludo"><h1>${saludo}</h1><p>${dias>0?`Quedan <span class="num">${dias}</span> días para el examen.`:"Ya es el examen. Mucha suerte."} ${frase()}</p></section>

  <h2 class="sec">Si el sorteo fuera hoy<span>${k} de ${el} temas listos</span></h2>
  <div class="card pad">

    <div class="pista">${k<TOTAL?`Con ${sig-k} temas más de memoria: <span class="num">${pct(cobertura(sig))}</span>.`:""} La franja clara es tu techo con los ${el} elegidos: <span class="num">${pct(cobertura(el))}</span>.</div>
  </div>

  <h2 class="sec">Esta semana<span>meta ${S.meta} h</span></h2>
  <div class="card pad">
    <div class="cifras"><div class="grande num">${(minS/60).toFixed(1).replace(".",",")} h</div><button class="btn peq" id="bRato">Registrar un rato</button></div>
    <div class="barra"><b style="width:${Math.min(100,minS/meta*100)}%"></b></div>
    <div class="pista">${minS>=meta?"Semana cumplida. Lo demás es propina.":"Sin prisa: cuenta lo que hagas, no lo que falte."}</div>
  </div>

  ${refr.length?`<h2 class="sec">Para refrescar<span>temas que llevas tiempo sin escribir</span></h2>
  <div class="lista">${refr.map(x=>itemTema(x.n)).join("")}</div>`:""}

  <h2 class="sec">Sellos<span>${Object.keys(S.sellos).length} de ${SELLOS.length}</span></h2>
  <div class="sellos">${SELLOS.map(([id,nom,,m])=>`<div class="sello ${S.sellos[id]?"si":""}"><div class="m">${m}</div>${nom}</div>`).join("")}</div>
  <div style="height:20px"></div>`;
  $("#bRato").onclick=()=>registrarRato();
  enlazarItems();
}
function frase(){
  const F=["Un tema bien escrito vale más que tres a medias.","Hoy basta con un rato.","La constancia gana a la intensidad.","Escribe como si el tribunal fuera curioso.","Cada tema de memoria mueve la aguja del sorteo.","Un problema rehecho es un problema que ya es tuyo."];
  return F[(new Date().getDate())%F.length];
}

function puntos(est){return `<span class="puntos">${[1,2,3,4].map(i=>`<i class="${est>=i?"s":""}"></i>`).join("")}</span>`;}
function itemTema(n){
  const t=S.temas[n];
  const corto=TEMARIO[n].split(". ")[0].replace(/\.$/,"");
  return `<button class="item ${t.sel?"":"fuera"}" data-tema="${n}"><span class="n">${n}</span><span class="t"><b>${esc(corto)}</b><small>${ESTADOS[t.est]}${t.sel&&t.tipo==="l"?" · para lucir":""}</small></span>${puntos(t.est)}</button>`;
}
function vTemas(){
  let ns=[];
  for(let n=1;n<=TOTAL;n++){const t=S.temas[n]; if(filtroTemas==="mios"&&!t.sel)continue; if(filtroTemas==="lucir"&&!(t.sel&&t.tipo==="l"))continue; ns.push(n);}
  const porBloque={}; ns.forEach(n=>{(porBloque[bloqueDe(n)]=porBloque[bloqueDe(n)]||[]).push(n);});
  const cuenta=[0,0,0,0,0]; elegidos().forEach(n=>cuenta[S.temas[n].est]++);

  <section class="saludo"><h1>Temas</h1><p>${elegidos().length} elegidos · ${cuenta[3]+cuenta[4]} de memoria · ${cuenta[2]} redactados · ${cuenta[1]} en esquema</p></section>

  ${BLOQUES.filter(b=>porBloque[b]).map(b=>`<h2 class="sec">${b}<span>${porBloque[b].length}</span></h2><div class="lista">${porBloque[b].map(itemTema).join("")}</div>`).join("")}

  <div class="fila" style="margin:10px 0 2px">

  </div>
  <div class="seg">${ESTADOS.map((e,i)=>`<button data-est="${i}" class="${t.est===i?"on":""}">${e}</button>`).join("")}</div>
  <p class="pista" id="ayudaEst" style="margin:6px 2px 0">${ESTADOS_AYUDA[t.est]}</p>
  ${L?`<h2 class="sec" style="margin-top:20px">Libros</h2><dl class="libros"><dt>Base</dt><dd>${esc(L[0])}</dd><dt>Apoyo, solo para</dt><dd>${esc(L[1])}</dd><dt>Problemas</dt><dd>${esc(L[2])}</dd></dl>`:`<p class="pista" style="margin-top:16px">Sin libros asignados todavía.</p>`}
  ${ESQ[n]?`<div class="fila" style="margin-top:14px"><a class="btn sec peq" href="${DOC_ESQ}#${ESQ[n]}" target="_blank" rel="noopener">Abrir esqueleto ↗</a></div>`:""}
  <label class="campo">La idea que lo vertebra, el índice, lo que no puede faltar<textarea id="tNota" placeholder="p. ej. Hilo: de Bolzano a la compacidad. Cierre didáctico: …">${esc(t.nota)}</textarea></label>
  <div class="pista" style="margin-top:10px">${ses?`Llevas <span class="num">${(ses/60).toFixed(1).replace(".",",")}</span> h en este tema.`:""} ${t.rep?`Última vez escrito: ${fmtFecha(t.rep)}.`:""}</div>
  <div class="fila" style="margin-top:16px">
    <button class="btn peq" id="tRato">Registrar un rato</button>
    ${t.est>=2?`<button class="btn sec peq" id="tRep">Lo he reescrito hoy</button>`:""}
    <button class="btn sec peq" id="tSim">Simulacro</button>
  </div>`);
  bindCerrar();
  $("#tSel").onclick=()=>{t.sel=!t.sel;guardar();fichaTema(n);pintar();};
  document.querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{t.tipo=b.dataset.tipo;guardar();fichaTema(n);pintar();});
  document.querySelectorAll("[data-est]").forEach(b=>b.onclick=()=>{const prev=t.est;t.est=+b.dataset.est;if(t.est>=3&&prev<3)t.rep=hoyISO();guardar();fichaTema(n);pintar();if(t.est>=3&&prev<3)toast(`Ahora: ${pct(cobertura(listos().length))} en el sorteo`);});
  $("#tNota").onchange=e=>{t.nota=e.target.value;guardar();};
  $("#tRato").onclick=()=>registrarRato({tipo:"tema",tema:n});
  if($("#tRep"))$("#tRep").onclick=()=>{t.rep=hoyISO();guardar();toast("Anotado");fichaTema(n);pintar();};
  $("#tSim").onclick=()=>simulacro([n],n);
}
function fmtFecha(iso){const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});}
function bindCerrar(){document.querySelectorAll("[data-cerrar]").forEach(b=>b.onclick=cerrar);}

/* ===================== REGISTRO DE RATOS ===================== */
function registrarRato(pre={}){
  const tipo=pre.tipo||"tema";
  const opcT=elegidos().map(n=>`<option value="${n}" ${pre.tema==n?"selected":""}>${n}. ${esc(TEMARIO[n].split(". ")[0])}</option>`).join("");
  abrir(`<div class="cab"><h3>Registrar un rato</h3><button class="cerrar" data-cerrar>×</button></div>
  <div class="fila" style="margin-top:6px">${[["tema","Tema"],["problemas","Problemas"],["lectura","Lectura"]].map(([k,l])=>`<button class="chip ${tipo===k?"on":""}" data-tr="${k}">${l}</button>`).join("")}</div>
  <div id="rTema" style="${tipo==="tema"?"":"display:none"}"><label class="campo">¿Qué tema?<select id="rT">${opcT}</select></label></div>
  <label class="campo">Minutos<div class="fila" id="rMins">${[20,30,45,60,90,120].map(m=>`<button class="chip" data-m="${m}">${m}</button>`).join("")}</div><input type="number" id="rMin" min="5" step="5" value="45" inputmode="numeric"></label>
  <label class="campo">Nota (opcional)<input type="text" id="rNota" placeholder="Una línea basta"></label>
  <div class="fila" style="margin-top:16px"><button class="btn" id="rOk">Guardar</button></div>`);
  bindCerrar();
  let t=tipo;
  document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{t=b.dataset.tr;document.querySelectorAll("[data-tr]").forEach(x=>x.classList.toggle("on",x===b));$("#rTema").style.display=t==="tema"?"":"none";});
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{$("#rMin").value=b.dataset.m;});
  $("#rOk").onclick=()=>{
    const min=Math.max(1,+$("#rMin").value||0);
    S.sesiones.push({d:hoyISO(),min,tipo:t,tema:t==="tema"?+$("#rT").value:null,nota:$("#rNota").value.trim()});
    guardar();cerrar();pintar();toast(`+${min} min`);
  };
}

/* ===================== SORTEO Y SIMULACRO ===================== */
function sacarBolas(){const a=[];while(a.length<BOLAS){const n=1+Math.floor(Math.random()*TOTAL);if(!a.includes(n))a.push(n);}return a.sort((x,y)=>x-y);}
function sorteo(){
  const b=sacarBolas();
  abrir(`<div class="cab"><div><div class="eyebrow">Ensayo del sorteo</div><h3>Cuatro bolas de 71</h3></div><button class="cerrar" data-cerrar>×</button></div>
  <div class="bolas">${b.map((n,i)=>{const t=S.temas[n];const mia=t.est>=3;return `<div class="bolaw"><div class="bola ${mia?"mia":""}" style="animation-delay:${i*.35}s">${n}</div><small>${esc(TEMARIO[n].split(". ")[0])}<br><span class="dim">${t.sel?ESTADOS[t.est]:"No elegido"}</span></small>${t.est>=2?`<button data-simt="${n}">Escribirlo</button>`:""}</div>`;}).join("")}</div>
  <div class="aviso-suave" id="sRes" style="opacity:0;transition:opacity .4s"></div>
  <div class="fila" style="margin-top:14px"><button class="btn sec peq" id="sOtra">Otra vez</button></div>`);
  bindCerrar();
  document.querySelectorAll(".bola").forEach(e=>e.classList.add("cae"));
  const mias=b.filter(n=>S.temas[n].est>=3).length, elig=b.filter(n=>S.temas[n].sel).length;
  setTimeout(()=>{const r=$("#sRes");if(!r)return;r.style.opacity=1;r.textContent=mias>=2?`Te salen ${mias} temas preparados: puedes elegir.`:mias===1?"Te sale uno preparado. Con eso basta para escribir con calma.":elig?`Ninguno está aún de memoria, pero ${elig} ${elig>1?"son":"es"} de tus elegidos. Ese es el camino.`:"Ninguno tuyo esta vez. Por eso preparas 30.";},BOLAS*350+400);
  $("#sOtra").onclick=sorteo;
  document.querySelectorAll("[data-simt]").forEach(x=>x.onclick=()=>simulacro(b,+x.dataset.simt));
}
const reloj={id:null,fin:0,tema:null,bolas:null,inicio:0};
function simulacro(bolas,tema){
  abrir(`<div class="cab"><div><div class="eyebrow">Simulacro · sin libros</div><h3>Tema ${tema}. ${esc(TEMARIO[tema])}</h3></div><button class="cerrar" id="simX">×</button></div>
  <div class="reloj" id="relojTxt">${fmtReloj(S.minSim*60)}</div>
  <p class="pista" style="text-align:center">${S.minSim} minutos, como en el examen. Puedes cambiarlo en ajustes.</p>
  <div class="fila" style="justify-content:center;margin-top:12px"><button class="btn" id="simGo">Empezar</button><button class="btn sec" id="simFin" style="display:none">He terminado</button></div>`);
  $("#simX").onclick=()=>{ if(reloj.id&&!confirm("¿Dejar el simulacro? No se guardará."))return; pararReloj(); cerrar(); };
  $("#simGo").onclick=()=>{
    reloj.tema=tema;reloj.bolas=bolas;reloj.inicio=Date.now();reloj.fin=Date.now()+S.minSim*60000;
    $("#simGo").style.display="none";$("#simFin").style.display="";
    reloj.id=setInterval(tic,500);tic();
    try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>reloj.lock=l).catch(()=>{});}catch(e){}
  };
  $("#simFin").onclick=()=>terminarSim();
}
function fmtReloj(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function tic(){const q=(reloj.fin-Date.now())/1000;const e=$("#relojTxt");if(e)e.textContent=fmtReloj(q);if(q<=0){terminarSim(true);}}
function pararReloj(){clearInterval(reloj.id);reloj.id=null;try{reloj.lock&&reloj.lock.release();}catch(e){}}
function terminarSim(agotado){
  if(!reloj.id)return;
  pararReloj();
  const min=Math.max(1,Math.round((Date.now()-reloj.inicio)/60000));
  const n=reloj.tema;
  abrir(`<div class="cab"><h3>${agotado?"Tiempo":"Terminado"}</h3><button class="cerrar" data-cerrar>×</button></div>
  <p class="muted">Tema ${n}, <span class="num">${min}</span> minutos. ¿Cómo ha ido?</p>
  <div class="fila" style="margin-top:10px"><button class="btn" data-sr="bien">Bien: lo daría</button><button class="btn sec" data-sr="justo">Justo</button><button class="btn sec" data-sr="flojo">Flojo</button></div>
  <label class="campo">Qué te ha faltado (opcional)<input type="text" id="simNota" placeholder="p. ej. la demostración de Bolzano, el cierre didáctico"></label>`);
  bindCerrar();
  document.querySelectorAll("[data-sr]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.sr,t=S.temas[n];
    S.simulacros.push({d:hoyISO(),bolas:reloj.bolas,tema:n,min,res:r,nota:$("#simNota").value.trim()});
    S.sesiones.push({d:hoyISO(),min,tipo:"simulacro",tema:n,nota:""});
    t.rep=hoyISO();
    if(r==="bien")t.est=Math.max(t.est,4); else if(r==="justo")t.est=Math.max(t.est,3);
    if($("#simNota").value.trim()) t.nota=(t.nota?t.nota+"\n":"")+"Simulacro "+fmtFecha(hoyISO())+": falta "+$("#simNota").value.trim();
    guardar();cerrar();pintar();toast(r==="bien"?"Tema pulido":"Guardado. A la próxima");
  });
}

/* ===================== PROBLEMAS ===================== */
const INTERVALO={bien:21,justo:7,mal:2};
function programar(p,r){
  const prev=p.int||0; let i;
  if(r==="mal")i=2; else if(r==="justo")i=Math.max(7,Math.round(prev*1.2)); else i=prev?Math.min(120,Math.round(prev*2.5)):21;
  p.int=i;p.prox=sumaDias(hoyISO(),i);(p.hist=p.hist||[]).push({d:hoyISO(),r});
}
function itemProblema(p){
  const h=hoyISO();
  const due=p.prox&&p.prox<=h;
  return `<button class="item" data-prob="${p.id}"><span class="t"><b>${esc(p.ref||p.fuente)}</b><small>${esc(p.fuente)}${p.tecnica?" · "+esc(p.tecnica):""}</small></span><span class="pista" style="text-align:right;white-space:nowrap">${due?"hoy":p.prox?fmtFecha(p.prox):""}</span></button>`;
}
function vProblemas(){

  const tecnicas={};S.problemas.forEach(p=>{if(p.tecnica)tecnicas[p.tecnica]=(tecnicas[p.tecnica]||0)+1;});
  const topT=Object.entries(tecnicas).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $("#vista").innerHTML=`
  <section class="saludo"><h1>Problemas</h1><p>${S.problemas.length} resueltos · ${pend.length} para rehacer hoy</p></section>
  <div class="fila" style="margin-top:12px"><button class="btn" id="pNuevo">Anotar un problema</button></div>
  ${topT.length?`<h2 class="sec">Tus técnicas<span>las que más usas</span></h2><div class="fila">${topT.map(([t,c])=>`<button class="chip" data-tq="${esc(t)}">${esc(t)} <span class="num">${c}</span></button>`).join("")}</div>`:""}
  <h2 class="sec">Todos<span>${L.length}</span></h2>
  <div class="fila">${["todos",...BLOQUES].map(b=>`<button class="chip ${filtroProb===b?"on":""}" data-pb="${b}">${b==="todos"?"Todos":b}</button>`).join("")}</div>
  <input class="buscar" type="text" id="pBus" placeholder="Buscar por fuente, técnica o nota" value="${esc(busqProb)}">
  ${L.length?`<div class="lista">${L.map(itemProblema).join("")}</div>`:`<div class="card vacio">Anota cada problema que resuelvas con su técnica estrella: la idea que lo desbloquea. La app te lo devolverá para rehacerlo a los pocos días, luego a las semanas.</div>`}
  <div style="height:24px"></div>`;
  $("#pNuevo").onclick=()=>nuevoProblema();
  document.querySelectorAll("[data-pb]").forEach(b=>b.onclick=()=>{filtroProb=b.dataset.pb;vProblemas();});
  document.querySelectorAll("[data-tq]").forEach(b=>b.onclick=()=>{busqProb=b.dataset.tq;vProblemas();});
  $("#pBus").oninput=e=>{busqProb=e.target.value;clearTimeout(vProblemas._t);vProblemas._t=setTimeout(()=>{vProblemas();const i=$("#pBus");i.focus();i.setSelectionRange(i.value.length,i.value.length);},350);};
  enlazarItems();
}
function nuevoProblema(){
  const tecs=[...new Set(S.problemas.map(p=>p.tecnica).filter(Boolean))];
  abrir(`<div class="cab"><h3>Anotar un problema</h3><button class="cerrar" data-cerrar>×</button></div>

  <label class="campo">Técnica estrella<input type="text" id="nT" list="tecs" placeholder="p. ej. reducir módulo p, simetría, telescópica"><datalist id="tecs">${tecs.map(t=>`<option value="${esc(t)}">`).join("")}</datalist></label>

    programar(p,b.dataset.nr);S.problemas.push(p);guardar();cerrar();pintar();toast("Vuelve el "+fmtFecha(p.prox));

}
function fichaProblema(id){
  const p=S.problemas.find(x=>x.id===id); if(!p)return;
  const R={bien:"bien",justo:"con ayuda",mal:"no salió"};
  abrir(`<div class="cab"><div><div class="eyebrow">${esc(p.bloque)}</div><h3>${esc(p.ref||p.fuente)}</h3></div><button class="cerrar" data-cerrar>×</button></div>
  <dl class="libros"><dt>Fuente</dt><dd>${esc(p.fuente)}</dd><dt>Técnica</dt><dd>${esc(p.tecnica||"—")}</dd>${p.nota?`<dt>Nota</dt><dd>${esc(p.nota)}</dd>`:""}<dt>Historial</dt><dd>${(p.hist||[]).map(h=>`${fmtFecha(h.d)}: ${R[h.r]}`).join(" · ")}</dd><dt>Vuelve</dt><dd>${p.prox?fmtFecha(p.prox):"—"}</dd></dl>
  <label class="campo">Lo he rehecho hoy y ha ido…</label>

  <div class="fila" style="margin-top:22px"><button class="btn peligro peq" id="pBorra">Borrar</button></div>`);

let verToda=false, filtroToda="todo", busqToda="";
const ROLES_TXT={todo:"Todos",temas:"Temas",problemas:"Problemas",consulta:"Consulta",reserva:"Reserva",mesa:"La mesa",estanteria:"Estantería"};
function sinAcentos(x){return x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function listaToda(){
  const q=sinAcentos(busqToda.trim());
  const L=TODA.filter(b=>(filtroToda==="todo"||b.r===filtroToda)&&(!q||sinAcentos(b.a+" "+b.t).includes(q)));

  return L.map(b=>`<div class="item" style="padding:10px 14px"><span class="t"><b>${esc(b.t)}</b><small>${esc(b.a)}</small></span><span class="chip ${b.r==="temas"||b.r==="problemas"?"lucir":""}">${ROLES_TXT[b.r]}</span></div>`).join("");
}

  $("#aOk").onclick=()=>{S.examen=$("#aF").value||S.examen;S.meta=Math.max(1,+$("#aM").value||14);S.minSim=Math.max(30,+$("#aS").value||120);guardar();cerrar();pintar();};
  $("#aRec").onclick=()=>recordatorios();
  $("#aCero").onclick=()=>{if(confirm("¿Borrar todos tus datos de El sorteo? No se puede deshacer.")){const m=S.meta,f=S.examen,ms=S.minSim;S=estadoInicial();S.meta=m;S.examen=f;S.minSim=ms;guardar();cerrar();vistaActual="hoy";pintar();toast("Todo a cero");}};
  $("#aExp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="el-sorteo-"+hoyISO()+".json";a.click();};
  $("#aImp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.temas)throw 0;if(confirm("¿Sustituir tus datos por los del archivo?")){S=o;guardar();cerrar();pintar();toast("Datos importados");}}catch(x){toast("Ese archivo no es una copia de El sorteo");}});};
}


/* ===================== RECORDATORIOS ===================== */
const DIAS_C=["L","M","X","J","V","S","D"], DIAS_RR=["MO","TU","WE","TH","FR","SA","SU"];
function proximaFecha(r){ // primer día (incluido hoy) que cae en uno de sus días
  const d=new Date(); for(let i=0;i<7;i++){const w=(d.getDay()+6)%7; if(r.d.includes(w))return d; d.setDate(d.getDate()+1);} return new Date();
}
function stampLocal(d,hhmm,masMin){const [h,m]=hhmm.split(":").map(Number);const x=new Date(d);x.setHours(h,m+(masMin||0),0,0);
  const z=n=>String(n).padStart(2,"0");return x.getFullYear()+z(x.getMonth()+1)+z(x.getDate())+"T"+z(x.getHours())+z(x.getMinutes())+"00";}
function rrule(r){return "RRULE:FREQ=WEEKLY;BYDAY="+r.d.slice().sort().map(i=>DIAS_RR[i]).join(",");}
function urlGoogle(r){
  const d=proximaFecha(r);
  const q=new URLSearchParams({action:"TEMPLATE",text:r.t,dates:stampLocal(d,r.h)+"/"+stampLocal(d,r.h,r.min),ctz:"Europe/Madrid",recur:rrule(r),details:(r.x?r.x+"\n\n":"")+"El sorteo: https://diazepamina-creator.github.io/el-sorteo/"});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function icsEsc(t){return String(t).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/([,;])/g,"\\$1");}
function ics(lista){
  const ahora=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const ev=lista.filter(r=>r.d.length).map(r=>{const d=proximaFecha(r);return ["BEGIN:VEVENT","UID:"+r.id+"-"+Date.now()+"@el-sorteo","DTSTAMP:"+ahora,
    "DTSTART;TZID=Europe/Madrid:"+stampLocal(d,r.h),"DTEND;TZID=Europe/Madrid:"+stampLocal(d,r.h,r.min),rrule(r),
    "SUMMARY:"+icsEsc(r.t),"DESCRIPTION:"+icsEsc(r.x||""),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(r.t),"TRIGGER:-PT10M","END:VALARM","END:VEVENT"].join("\r\n");});
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//El sorteo//ES","CALSCALE:GREGORIAN",
    "BEGIN:VTIMEZONE","TZID:Europe/Madrid","BEGIN:DAYLIGHT","TZOFFSETFROM:+0100","TZOFFSETTO:+0200","DTSTART:19700329T020000","RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU","END:DAYLIGHT",
    "BEGIN:STANDARD","TZOFFSETFROM:+0200","TZOFFSETTO:+0100","DTSTART:19701025T030000","RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU","END:STANDARD","END:VTIMEZONE",
    ...ev,"END:VCALENDAR"].join("\r\n");
}
function recordatorios(){
  const fila=(r,i)=>`<div class="card pad" style="margin-top:10px" data-ri="${i}">
    <input type="text" data-k="t" value="${esc(r.t)}" aria-label="Nombre del bloque">
    <div class="fila" style="margin-top:8px">${DIAS_C.map((c,w)=>`<button class="chip ${r.d.includes(w)?"on":""}" data-dia="${w}" style="min-width:32px;justify-content:center;padding:5px 8px">${c}</button>`).join("")}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label class="campo">Hora<input type="time" data-k="h" value="${r.h}" style="width:100%;border:1px solid var(--linea);background:var(--papel);border-radius:10px;padding:9px 11px"></label>
      <label class="campo">Minutos<input type="number" data-k="min" min="10" max="300" step="5" value="${r.min}"></label>
    </div>
    <div class="fila" style="margin-top:12px"><a class="btn peq" data-gc href="${urlGoogle(r)}" target="_blank" rel="noopener">Añadir a Google Calendar ↗</a><button class="btn sec peq" data-quita>Quitar</button></div>
  </div>`;
  abrir(`<div class="cab"><h3>Recordatorios</h3><button class="cerrar" data-cerrar>×</button></div>
  <p class="pista">Una web instalada no puede avisarte con la app cerrada, pero tu calendario sí. Cada botón abre Google Calendar con el evento ya repetido cada semana: solo tienes que pulsar <b>Guardar</b> allí. El aviso será el que tengas por defecto en Google Calendar; si lo quieres, cámbialo en el propio evento.</p>
  <div id="recL">${S.rec.map(fila).join("")}</div>
  <div class="fila" style="margin-top:14px"><button class="btn sec peq" id="recMas">Añadir un bloque</button><button class="btn sec peq" id="recIcs">Descargar todos (.ics)</button><button class="btn sec peq" id="recDef">Volver a los de serie</button></div>
  <p class="pista" style="margin-top:10px">El .ics sirve para otros calendarios (Samsung, Outlook, Proton) y trae un aviso 10 minutos antes. Si cambias una hora aquí, borra el evento antiguo del calendario y vuelve a añadirlo.</p>`);
  bindCerrar();
  const rehacer=()=>{guardar();recordatorios();};
  document.querySelectorAll("[data-ri]").forEach(c=>{
    const r=S.rec[+c.dataset.ri];
    const gc=c.querySelector("[data-gc]");
    const act=()=>{guardar();gc.href=urlGoogle(r);gc.style.opacity=r.d.length?1:.4;};
    c.querySelectorAll("[data-k]").forEach(inp=>inp.onchange=()=>{const k=inp.dataset.k;r[k]=k==="min"?Math.max(10,+inp.value||60):(inp.value||r[k]);act();});
    c.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>{const w=+b.dataset.dia;r.d=r.d.includes(w)?r.d.filter(x=>x!==w):[...r.d,w];b.classList.toggle("on");act();});
    gc.onclick=e=>{if(!r.d.length){e.preventDefault();toast("Elige al menos un día");}};
    c.querySelector("[data-quita]").onclick=()=>{S.rec.splice(+c.dataset.ri,1);rehacer();};
  });
  $("#recMas").onclick=()=>{S.rec.push({id:"b"+Date.now(),t:"Nuevo bloque",d:[0],h:"18:00",min:60,x:""});rehacer();};
  $("#recDef").onclick=()=>{if(confirm("¿Volver a los cuatro bloques de serie?")){S.rec=recIniciales();rehacer();}};
  $("#recIcs").onclick=()=>{const b=new Blob([ics(S.rec)],{type:"text/calendar"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="el-sorteo-recordatorios.ics";a.click();};
}

/* ===================== ARRANQUE ===================== */
cargar(); pintar();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
